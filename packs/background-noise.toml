[[tweak]]
id = "wmi-autologgers-off"
name = "Autologgers: WMI telemetry ETW logs off"
group = "WMI autologgers"
preset = "min"

[[tweak.action]]
type = "command"
apply = '''
foreach ($n in @('DiagTrack-Listener', 'SQMLogger', 'SetupPlatformTel', 'DiagLog', 'NetTrace')) {
    $p = "HKLM:\SYSTEM\CurrentControlSet\Control\WMI\Autologger\$n"
    if (Test-Path -LiteralPath $p) {
        New-ItemProperty -LiteralPath $p -Name Start -Value 0 -PropertyType DWord -Force | Out-Null
    }
}
exit 0
'''
reset = '''
foreach ($n in @('DiagTrack-Listener', 'SQMLogger', 'SetupPlatformTel', 'DiagLog', 'NetTrace')) {
    $p = "HKLM:\SYSTEM\CurrentControlSet\Control\WMI\Autologger\$n"
    if (Test-Path -LiteralPath $p) {
        New-ItemProperty -LiteralPath $p -Name Start -Value 1 -PropertyType DWord -Force | Out-Null
    }
}
exit 0
'''
check = '''
$applied = 0
$default = 0
$existing = 0
foreach ($n in @('DiagTrack-Listener', 'SQMLogger', 'SetupPlatformTel', 'DiagLog', 'NetTrace')) {
    $p = "HKLM:\SYSTEM\CurrentControlSet\Control\WMI\Autologger\$n"
    if (-not (Test-Path -LiteralPath $p)) { continue }
    $existing++
    $v = (Get-ItemProperty -LiteralPath $p -Name Start -ErrorAction SilentlyContinue).Start
    if ($v -eq 0) { $applied++ } else { $default++ }
}
if ($existing -eq 0) { exit 1 }
if ($applied -eq $existing) { exit 0 }
if ($applied -eq 0) { exit 1 }
exit 2
'''

