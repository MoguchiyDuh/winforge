[[tweak]]
id = "edge-updater-tasks"
name = "Edge: disable EdgeUpdate scheduled tasks"
group = "Edge removal"
preset = "min"

[[tweak.action]]
type = "command"
apply = '''
Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object { $_.TaskPath -like '*EdgeUpdate*' } | ForEach-Object {
  try { Disable-ScheduledTask -InputObject $_ -ErrorAction Stop | Out-Null } catch { }
}
exit 0
'''
reset = '''
Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object { $_.TaskPath -like '*EdgeUpdate*' } | ForEach-Object {
  try { Enable-ScheduledTask -InputObject $_ -ErrorAction Stop | Out-Null } catch { }
}
exit 0
'''
check = '''
$tasks = @(Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object { $_.TaskPath -like '*EdgeUpdate*' })
if ($tasks.Count -eq 0) { exit 1 }
$enabled = @($tasks | Where-Object { $_.State -ne 'Disabled' })
if ($enabled.Count -eq 0) { exit 0 }
if ($enabled.Count -eq $tasks.Count) { exit 1 }
exit 2
'''

