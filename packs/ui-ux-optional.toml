[[tweak.action]]
type = "command"
os = "11"
apply = '''
$p = 'HKCU:\Control Panel\NotifyIconSettings'
if (Test-Path -LiteralPath $p) {
    foreach ($k in @(Get-ChildItem -LiteralPath $p -ErrorAction SilentlyContinue)) {
        New-ItemProperty -LiteralPath $k.PSPath -Name IsPromoted -Value 1 -PropertyType DWord -Force | Out-Null
    }
}
exit 0
'''
reset = '''
$p = 'HKCU:\Control Panel\NotifyIconSettings'
if (Test-Path -LiteralPath $p) {
    foreach ($k in @(Get-ChildItem -LiteralPath $p -ErrorAction SilentlyContinue)) {
        New-ItemProperty -LiteralPath $k.PSPath -Name IsPromoted -Value 0 -PropertyType DWord -Force | Out-Null
    }
}
exit 0
'''
check = '''
$p = 'HKCU:\Control Panel\NotifyIconSettings'
$keys = @(Get-ChildItem -LiteralPath $p -ErrorAction SilentlyContinue)
if ($keys.Count -eq 0) { exit 1 }
$on = 0
$off = 0
foreach ($k in $keys) {
    $v = (Get-ItemProperty -LiteralPath $k.PSPath -Name IsPromoted -ErrorAction SilentlyContinue).IsPromoted
    if ($v -eq 1) { $on++ } else { $off++ }
}
if ($on -eq 0) { exit 1 }
if ($off -eq 0) { exit 0 }
exit 2
'''

