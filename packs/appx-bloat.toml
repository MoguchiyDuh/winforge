meta = { id = "appx-bloat", title = "AppX bloat removal", description = "Removes Store app bloat (Cortana, Bing apps, Xbox, media, Copilot-era packages). One-way: appx has no stock restore.", oneway = true }

[[tweak]]
id = "appx-cortana"
name = "Appx: Cortana family"
group = "AppX packages"
os = "10"

[[tweak.action]]
type = "appx"
pattern = 'Microsoft.549981C3F5F10'
apply = "remove"

[[tweak.action]]
type = "appx"
pattern = 'Microsoft.Windows.Cortana'
apply = "remove"

[[tweak.action]]
type = "appx"
pattern = 'Microsoft.Windows.SearchCortex'
apply = "remove"

