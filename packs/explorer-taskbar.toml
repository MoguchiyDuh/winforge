id = "group-by-none"
name = "Explorer: group by = None (new views + Downloads; run Debloat once to clear saved views)"
group = "Group by none"
preset = "std"

[[tweak.action]]
type = "command"
apply = '''
$k = 'HKCU:\Software\Classes\Local Settings\Software\Microsoft\Windows\Shell\Bags\AllFolders\Shell'
New-Item -Path $k -Force -ErrorAction SilentlyContinue | Out-Null
New-ItemProperty -LiteralPath $k -Name GroupView -Value 0 -PropertyType DWord -Force -ErrorAction SilentlyContinue | Out-Null
New-ItemProperty -LiteralPath $k -Name GroupByKey -Value '' -PropertyType String -Force -ErrorAction SilentlyContinue | Out-Null
$t = 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\FolderTypes\{885a186e-a440-4ada-812b-db871b942259}\TopViews\{00000000-0000-0000-0000-000000000000}'
New-Item -Path $t -Force -ErrorAction SilentlyContinue | Out-Null
Set-ItemProperty -LiteralPath $t -Name ColumnList -Value 'prop:0(34)System.ItemNameDisplay;0System.DateModified;0System.ItemTypeText;0System.Size;1System.DateCreated;1System.Author;1System.Category;1System.Keywords;1System.Title' -Type String -Force
Set-ItemProperty -LiteralPath $t -Name GroupAscending -Value 0 -Type DWord -Force
Set-ItemProperty -LiteralPath $t -Name GroupBy -Value '' -Type String -Force
Set-ItemProperty -LiteralPath $t -Name LogicalViewMode -Value 1 -Type DWord -Force
Set-ItemProperty -LiteralPath $t -Name Name -Value NoName -Type String -Force
Set-ItemProperty -LiteralPath $t -Name Order -Value 0 -Type DWord -Force
Set-ItemProperty -LiteralPath $t -Name PrimaryProperty -Value System.DateModified -Type String -Force
Set-ItemProperty -LiteralPath $t -Name SortByList -Value 'prop:System.DateModified' -Type String -Force
exit 0
'''
reset = '''
foreach ($n in @('GroupView', 'GroupByKey')) {
    Remove-ItemProperty -LiteralPath 'HKCU:\Software\Classes\Local Settings\Software\Microsoft\Windows\Shell\Bags\AllFolders\Shell' -Name $n -ErrorAction SilentlyContinue
}
Remove-Item -LiteralPath 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\FolderTypes\{885a186e-a440-4ada-812b-db871b942259}' -Recurse -Force -ErrorAction SilentlyContinue
exit 0
'''
check = '''
$p = Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\Local Settings\Software\Microsoft\Windows\Shell\Bags\AllFolders\Shell' -ErrorAction SilentlyContinue
$t = Get-ItemProperty -LiteralPath 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\FolderTypes\{885a186e-a440-4ada-812b-db871b942259}\TopViews\{00000000-0000-0000-0000-000000000000}' -ErrorAction SilentlyContinue
$gv = if ($p) { $p.GroupView } else { $null }
$gbk = if ($p) { $p.GroupByKey } else { $null }
$gb = if ($t) { $t.GroupBy } else { $null }
if ($gv -eq 0 -and $null -ne $gbk -and $gbk -eq '' -and $null -ne $gb -and $gb -eq '') { exit 0 }
if ($null -eq $gv -and $null -eq $gbk -and $null -eq $gb) { exit 1 }
exit 2
'''

