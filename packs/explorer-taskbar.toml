[[tweak]]
id = "context-menu-new"
name = "Context menu: New submenu - only folder, text file, shortcut"
group = "Context menu"
preset = "std"

[[tweak.action]]
type = "command"
apply = '''
$keep = @('\.txt\', '\.lnk\', '\Directory\')
$targets = @()
$lines = reg query HKCR /f ShellNew /k /s 2>$null | Select-String 'HKEY_CLASSES_ROOT'
foreach ($l in $lines) {
    $p = $l.ToString().Trim()
    if ($p -match '\\\.txt\\ShellNew$' -or $p -match '\\\.lnk\\ShellNew$' -or $p -match '\\Directory\\ShellNew') { continue }
    $targets += $p
}
foreach ($p in $targets) {
    $k = $p -replace '^HKEY_CLASSES_ROOT', 'HKLM:\SOFTWARE\Classes'
    if (Test-Path -LiteralPath $k) { Remove-Item -LiteralPath $k -Recurse -Force -ErrorAction SilentlyContinue }
    $u = $p -replace '^HKEY_CLASSES_ROOT', 'HKCU:\Software\Classes'
    if (Test-Path -LiteralPath $u) { Remove-Item -LiteralPath $u -Recurse -Force -ErrorAction SilentlyContinue }
}
exit 0
'''
reset = '''
$types = @{
    '.bmp'        = @{ NullFile = ''; ItemName = '@C:\Windows\system32\mspaint.exe,-59414' }
    '.rtf'        = @{ Data = '{\rtf1}'; ItemName = '@C:\Program Files\Windows NT\Accessories\WORDPAD.EXE,-213' }
    '.contact'    = @{ command = '"C:\Program Files\Windows Mail\Wab.exe" /CreateContact "%1"'; iconpath = 'C:\Program Files\Windows Mail\wab.exe,1'; MenuText = '@C:\Program Files\Common Files\system\wab32res.dll,-10203' }
    '.library-ms' = @{ Handler = '{c7ca6167-2f46-4c4c-98b2-c92591368971}'; IconPath = 'C:\Windows\System32\imageres.dll,-1001'; NullFile = '' }
    '.zip'        = @{ Data = [byte[]](0x50, 0x4B, 0x05, 0x06, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00) }
}
foreach ($t in $types.Keys) {
    $p = 'HKLM:\SOFTWARE\Classes\' + $t + '\ShellNew'
    New-Item -Path $p -Force -ErrorAction SilentlyContinue | Out-Null
    foreach ($name in $types[$t].Keys) {
        $v = $types[$t][$name]
        if ($name -eq 'Data' -or $v -is [byte[]]) {
            New-ItemProperty -LiteralPath $p -Name $name -Value ([byte[]]$v) -PropertyType Binary -Force -ErrorAction SilentlyContinue | Out-Null
        } else {
            New-ItemProperty -LiteralPath $p -Name $name -Value $v -PropertyType String -Force -ErrorAction SilentlyContinue | Out-Null
        }
    }
}
$txt = 'HKLM:\SOFTWARE\Classes\.txt\ShellNew'
if (-not (Test-Path -LiteralPath $txt)) {
    New-Item -Path $txt -Force -ErrorAction SilentlyContinue | Out-Null
    New-ItemProperty -LiteralPath $txt -Name 'NullFile' -Value '' -PropertyType String -Force -ErrorAction SilentlyContinue | Out-Null
}
exit 0
'''
check = '''
$found = 0
$lines = reg query HKCR /f ShellNew /k /s 2>$null | Select-String 'HKEY_CLASSES_ROOT'
foreach ($l in $lines) {
    $p = $l.ToString().Trim()
    if ($p -match '\\\.txt\\ShellNew$' -or $p -match '\\\.lnk\\ShellNew$' -or $p -match '\\Directory\\ShellNew') { continue }
    $found++
}
if ($found -eq 0) { exit 0 }
if ($found -ge 4) { exit 1 }
exit 2
'''


[[tweak]]
id = "context-menu-sendto"
name = "Context menu: Send to - no fax, no mail recipient"
group = "Context menu"
preset = "std"

[[tweak.action]]
type = "command"
apply = '''
$sf = Join-Path $env:APPDATA 'Microsoft\Windows\SendTo'
Get-ChildItem -LiteralPath $sf -Force -ErrorAction SilentlyContinue |
    Where-Object { $_.Name -match 'fax' -or $_.Name -like '*MAPIMail' -or $_.Name -like 'Mail Recipient*' } |
    Remove-Item -Force -ErrorAction SilentlyContinue
exit 0
'''
reset = '''
$sf = Join-Path $env:APPDATA 'Microsoft\Windows\SendTo'
$mail = Join-Path $sf 'Mail Recipient.MAPIMail'
if (-not (Test-Path -LiteralPath $mail)) {
    New-Item -ItemType File -Path $mail -Force -ErrorAction SilentlyContinue | Out-Null
}
exit 0
'''
check = '''
$sf = Join-Path $env:APPDATA 'Microsoft\Windows\SendTo'
$found = Get-ChildItem -LiteralPath $sf -Force -ErrorAction SilentlyContinue |
    Where-Object { $_.Name -match 'fax' -or $_.Name -like '*MAPIMail' -or $_.Name -like 'Mail Recipient*' }
if (-not $found) { exit 0 }
exit 1
'''

