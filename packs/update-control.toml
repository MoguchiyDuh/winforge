meta = { id = "update-control", title = "Update control", description = "Automatic updates off via policy (Win10 also paused until 2038), no auto reboot with logged-on users, WU driver installs and Insider builds off, upgrade/restart nags off, app auto-restart after update off, Delivery Optimization P2P off, Edge updates blocked via EdgeUpdate keys, Media Player auto-update off; Defender definitions keep updating" }

[[tweak]]
id = "wu-auto-updates-off"
name = "Updates: automatic updates off (manual Check for updates still works)"
group = "Windows Update"
preset = "min"

[[tweak.action]]
type = "registry"
path = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
name = "NoAutoUpdate"
regtype = "dword"
apply = 1
reset = { delete = true }

