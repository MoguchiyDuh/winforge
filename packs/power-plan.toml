foreach ($s in @('be337238-0d82-4146-a960-4f3749d470c7', '45bcc044-d885-43e2-8605-ee0ec6e96b59')) {
    Remove-Item -LiteralPath "HKLM:\SYSTEM\CurrentControlSet\Control\Power\User\PowerSchemes\$a\$proc\$s" -Recurse -Force -ErrorAction SilentlyContinue
}
exit 0
