[[tweak]]
id = "nic-power"
name = "Performance: NIC power saving off (adapters never sleep)"
group = "Network"
preset = "std"

[[tweak.action]]
type = "command"
apply = '''
$netClass = 'HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4d36e972-e325-11ce-bfc1-08002be10318}'
$nics = @(Get-NetAdapter -Physical -ErrorAction SilentlyContinue)
$netKeys = @(Get-ChildItem -LiteralPath $netClass -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^\d{4}$' })
$fail = 0
foreach ($a in $nics) {
    $hit = $null
    foreach ($k in $netKeys) {
        $guid = (Get-ItemProperty -LiteralPath $k.PSPath -Name NetCfgInstanceId -ErrorAction SilentlyContinue).NetCfgInstanceId
        if ($guid -and $guid -eq ('{' + $a.InterfaceGuid + '}')) { $hit = $k.PSPath; break }
    }
    if (-not $hit) {
        foreach ($k in $netKeys) {
            $desc = (Get-ItemProperty -LiteralPath $k.PSPath -Name DriverDesc -ErrorAction SilentlyContinue).DriverDesc
            if ($desc -eq $a.InterfaceDescription) { $hit = $k.PSPath; break }
        }
    }
    if ($hit) {
        try { New-ItemProperty -LiteralPath $hit -Name PnPCapabilities -Value 24 -PropertyType DWord -Force -ErrorAction Stop | Out-Null } catch { $fail++ }
    }
}
if ($fail -gt 0) { exit 1 }
'''
reset = '''
$netClass = 'HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4d36e972-e325-11ce-bfc1-08002be10318}'
$netKeys = @(Get-ChildItem -LiteralPath $netClass -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^\d{4}$' })
foreach ($k in $netKeys) { Remove-ItemProperty -LiteralPath $k.PSPath -Name PnPCapabilities -ErrorAction SilentlyContinue }
exit 0
'''
check = '''
$netClass = 'HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4d36e972-e325-11ce-bfc1-08002be10318}'
$nics = @(Get-NetAdapter -Physical -ErrorAction SilentlyContinue)
$netKeys = @(Get-ChildItem -LiteralPath $netClass -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^\d{4}$' })
if ($nics.Count -eq 0 -or $netKeys.Count -eq 0) { exit 2 }
$applied = 0
$default = 0
foreach ($a in $nics) {
    $hit = $null
    foreach ($k in $netKeys) {
        $guid = (Get-ItemProperty -LiteralPath $k.PSPath -Name NetCfgInstanceId -ErrorAction SilentlyContinue).NetCfgInstanceId
        if ($guid -and $guid -eq ('{' + $a.InterfaceGuid + '}')) { $hit = $k.PSPath; break }
    }
    if (-not $hit) {
        foreach ($k in $netKeys) {
            $desc = (Get-ItemProperty -LiteralPath $k.PSPath -Name DriverDesc -ErrorAction SilentlyContinue).DriverDesc
            if ($desc -eq $a.InterfaceDescription) { $hit = $k.PSPath; break }
        }
    }
    if (-not $hit) { continue }
    $v = (Get-ItemProperty -LiteralPath $hit -Name PnPCapabilities -ErrorAction SilentlyContinue).PnPCapabilities
    if ($v -eq 24) { $applied++ } else { $default++ }
}
if ($applied -gt 0 -and $default -eq 0) { exit 0 }
if ($applied -eq 0) { exit 1 }
exit 2
'''

