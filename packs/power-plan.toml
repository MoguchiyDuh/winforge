[[tweak]]
id = "pagefile-off"
name = "Storage: automatic pagefile off (16GB+ RAM)"
group = "Pagefile"
preset = "max"
desc = "disables the automatically managed pagefile so Windows keeps no swap file (needs 16GB+ RAM, reboot to take effect; reset re-enables automatic management)"

[[tweak.action]]
type = "command"
apply = '''
$cs = Get-CimInstance Win32_ComputerSystem
if ($null -eq $cs) { exit 2 }
if ($cs.TotalPhysicalMemory -lt 16GB) { Write-Output 'skip: needs 16GB+ RAM'; exit 3 }
try {
    Set-CimInstance -InputObject $cs -Property @{ AutomaticManagedPagefile = $false } -ErrorAction Stop
    Get-CimInstance -Query 'SELECT * FROM Win32_PageFileSetting' -ErrorAction SilentlyContinue | Remove-CimInstance -ErrorAction SilentlyContinue
} catch { exit 3 }
Write-Output 'pagefile disabled, reboot to take effect'
'''
reset = '''
$cs = Get-CimInstance Win32_ComputerSystem
if ($null -ne $cs) { Set-CimInstance -InputObject $cs -Property @{ AutomaticManagedPagefile = $true } -ErrorAction SilentlyContinue }
exit 0
'''
check = '''
$cs = Get-CimInstance Win32_ComputerSystem
if ($null -eq $cs) { exit 2 }
if ($cs.AutomaticManagedPagefile -eq $false) { exit 0 }
if ($cs.AutomaticManagedPagefile -eq $true) { exit 1 }
exit 2
'''
