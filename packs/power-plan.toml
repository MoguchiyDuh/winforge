check = '''
function Get-Ac([string]$set) {
    $q = powercfg /q SCHEME_CURRENT 54533251-82be-4824-96c1-47b60b740d00 $set 2>$null
    if (-not $q) { return $null }
    $v = @($q | Select-String '0x[0-9a-fA-F]+' -AllMatches | ForEach-Object { $_.Matches[-1].Value })
    if ($v.Count -lt 2) { return $null }
    return [Convert]::ToInt64($v[-2].Substring(2), 16)
}
$bm = Get-Ac 'be337238-0d82-4146-a960-4f3749d470c7'
$bp = Get-Ac '45bcc044-d885-43e2-8605-ee0ec6e96b59'
