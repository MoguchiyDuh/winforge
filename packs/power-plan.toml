meta = { id = "power-plan", title = "Power plan", description = "High performance plan active, AC timeouts never, boost aggressive, hidden advanced power settings unhidden, PCIe link and NIC power saving off, hibernation and fast startup off, 8.3 short names and reserved storage off, Storage Sense and System Restore off, DiskCleanup task off, pagefile off (16GB+ RAM); System Restore off removes all restore points" }

[[tweak]]
id = "power-plan-high-performance"
name = "Power: High performance plan active"
group = "Power plan"
preset = "std"

[[tweak.action]]
type = "command"
apply = '''
$hp = '8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c'
powercfg /setactive $hp 2>$null
if (-not ("$(powercfg /getactivescheme)" -like "*$hp*")) {
    powercfg /duplicatescheme $hp 2>$null
    powercfg /setactive $hp 2>$null
}
if ("$(powercfg /getactivescheme)" -like "*$hp*") { exit 0 } else { exit 1 }
'''
reset = 'powercfg /setactive 381b4222-f694-41f0-9685-ff5bb260df2e'
check = '''
$a = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Power\User\PowerSchemes' -Name ActivePowerScheme -ErrorAction SilentlyContinue).ActivePowerScheme
if (-not $a) { exit 2 }
if ($a -eq '8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c') { exit 0 }
if ($a -eq '381b4222-f694-41f0-9685-ff5bb260df2e') { exit 1 }
exit 2
'''

[[tweak]]
id = "power-timeouts"
name = "Power: AC timeouts never, DC kept sane"
group = "Timeouts"
preset = "std"

[[tweak.action]]
type = "command"
apply = '''
powercfg /change monitor-timeout-ac 0
powercfg /change monitor-timeout-dc 10
powercfg /change disk-timeout-ac 0
powercfg /change disk-timeout-dc 20
powercfg /change standby-timeout-ac 0
powercfg /change standby-timeout-dc 20
powercfg /change hibernate-timeout-ac 0
powercfg /change hibernate-timeout-dc 0
'''
reset = '''
powercfg /change monitor-timeout-ac 10
powercfg /change monitor-timeout-dc 5
powercfg /change disk-timeout-ac 20
powercfg /change disk-timeout-dc 10
powercfg /change standby-timeout-ac 30
powercfg /change standby-timeout-dc 15
powercfg /change hibernate-timeout-ac 0
powercfg /change hibernate-timeout-dc 0
'''
check = '''
function Get-Idx([string]$sub, [string]$set) {
    $q = powercfg /q SCHEME_CURRENT $sub $set 2>$null
    if (-not $q) { return $null }
    $v = @($q | Select-String '0x[0-9a-fA-F]+' -AllMatches | ForEach-Object { $_.Matches[-1].Value })
    if ($v.Count -lt 2) { return $null }
    return @([Convert]::ToInt64($v[-2].Substring(2), 16), [Convert]::ToInt64($v[-1].Substring(2), 16))
}
$video = Get-Idx '7516b95f-f776-4464-8c53-06167f40cc99' '3c0bc021-c8a8-4e07-a973-6b14cbcb2b7e'
$disk = Get-Idx '0012ee47-9041-4b5d-9b77-535fba8b1442' '6738e2c4-e8a5-4a42-b16a-e040e769756e'
$standby = Get-Idx '238c9fa8-0aad-41ed-83f4-97be242c8f20' '29f6c1db-86da-48c5-9fdb-f2b67b1f44da'
if ($null -eq $video -or $null -eq $disk -or $null -eq $standby) { exit 2 }
$applied = @(@(0, 600), @(0, 1200), @(0, 1200))
$default = @(@(600, 300), @(1200, 600), @(1200, 900))
$actual = @($video, $disk, $standby)
$okA = 0
$okD = 0
for ($i = 0; $i -lt 3; $i++) {
    if ($actual[$i][0] -eq $applied[$i][0] -and $actual[$i][1] -eq $applied[$i][1]) { $okA++ }
    if ($actual[$i][0] -eq $default[$i][0] -and $actual[$i][1] -eq $default[$i][1]) { $okD++ }
}
if ($okA -eq 3) { exit 0 }
if ($okD -eq 3) { exit 1 }
exit 2
'''

