[[tweak]]
id = "wallpaper-black"
name = "Appearance: pure black wallpaper desktop + lock"
group = "Black wallpaper"
preset = "manual"

[[tweak.action]]
type = "file"
from = "black.bmp"
to = 'C:\Windows\Web\Wallpaper\winforge\black.bmp'

[[tweak.action]]
type = "registry"
path = 'HKCU\Control Panel\Desktop'
name = "WallPaper"
regtype = "sz"
apply = 'C:\Windows\Web\Wallpaper\winforge\black.bmp'
reset = 'C:\Windows\Web\Wallpaper\Windows\img0.jpg'

[[tweak.action]]
type = "registry"
path = 'HKCU\Control Panel\Desktop'
name = "WallpaperStyle"
regtype = "sz"
apply = "10"
reset = "10"

[[tweak.action]]
type = "registry"
path = 'HKCU\Control Panel\Desktop'
name = "TileWallpaper"
regtype = "sz"
apply = "0"
reset = "0"

[[tweak.action]]
type = "registry"
path = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Personalization'
name = "LockScreenImage"
regtype = "sz"
apply = 'C:\Windows\Web\Wallpaper\winforge\black.bmp'
reset = { delete = true }

[[tweak]]
id = "wallpaper-theme-file"
name = "Appearance: patch active theme file wallpaper"
group = "Black wallpaper"
preset = "manual"

[[tweak.action]]
type = "command"
apply = '''
$tf = (Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes' -Name CurrentTheme -ErrorAction SilentlyContinue).CurrentTheme
if ($tf -and (Test-Path -LiteralPath $tf)) {
    $txt = Get-Content -LiteralPath $tf -Raw
    $new = [regex]::Replace($txt, '(?m)^Wallpaper=.*$', 'Wallpaper=C:\Windows\Web\Wallpaper\winforge\black.bmp')
    if ($new -ne $txt) { Set-Content -LiteralPath $tf -Value $new -Encoding UTF8 }
}
exit 0
'''
reset = '''
$tf = (Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes' -Name CurrentTheme -ErrorAction SilentlyContinue).CurrentTheme
if ($tf -and (Test-Path -LiteralPath $tf)) {
    $txt = Get-Content -LiteralPath $tf -Raw
    $new = [regex]::Replace($txt, '(?m)^Wallpaper=.*$', 'Wallpaper=C:\Windows\Web\Wallpaper\Windows\img0.jpg')
    if ($new -ne $txt) { Set-Content -LiteralPath $tf -Value $new -Encoding UTF8 }
}
exit 0
'''
check = '''
$tf = (Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes' -Name CurrentTheme -ErrorAction SilentlyContinue).CurrentTheme
if (-not $tf -or -not (Test-Path -LiteralPath $tf)) { exit 1 }
$line = Get-Content -LiteralPath $tf -ErrorAction SilentlyContinue | Where-Object { $_ -match '^(?i)Wallpaper=' } | Select-Object -First 1
if (-not $line) { exit 1 }
$v = ($line -replace '^(?i)Wallpaper=', '').Trim()
if ($v -ieq 'C:\Windows\Web\Wallpaper\winforge\black.bmp') { exit 0 }
if ($v -ieq 'C:\Windows\Web\Wallpaper\Windows\img0.jpg') { exit 1 }
exit 2
'''

