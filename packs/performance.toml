[[tweak]]
id = "nagle-off"
name = "Performance: Nagle off, low-latency TCP (per interface)"
group = "Network"
preset = "std"

[[tweak.action]]
type = "command"
apply = '''
$ti = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces'
$fail = 0
foreach ($k in @(Get-ChildItem -Path $ti -ErrorAction SilentlyContinue)) {
    $ip = (Get-ItemProperty -LiteralPath $k.PSPath -Name DhcpIPAddress -ErrorAction SilentlyContinue).DhcpIPAddress
    $ifaceAddrs = (Get-ItemProperty -LiteralPath $k.PSPath -Name IPAddress -ErrorAction SilentlyContinue).IPAddress
    if (-not $ip -and -not $ifaceAddrs) { continue }
    foreach ($n in @('TcpAckFrequency', 'TCPNoDelay', 'TcpDelAckTicks')) {
        try { New-ItemProperty -LiteralPath $k.PSPath -Name $n -Value 1 -PropertyType DWord -Force -ErrorAction Stop | Out-Null } catch { $fail++ }
    }
}
if ($fail -gt 0) { exit 1 }
'''
reset = '''
$ti = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces'
foreach ($k in @(Get-ChildItem -Path $ti -ErrorAction SilentlyContinue)) {
    foreach ($n in @('TcpAckFrequency', 'TCPNoDelay', 'TcpDelAckTicks')) { Remove-ItemProperty -LiteralPath $k.PSPath -Name $n -ErrorAction SilentlyContinue }
}
exit 0
'''
check = '''
$ti = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces'
$cand = 0
$applied = 0
$default = 0
foreach ($k in @(Get-ChildItem -Path $ti -ErrorAction SilentlyContinue)) {
    $ip = (Get-ItemProperty -LiteralPath $k.PSPath -Name DhcpIPAddress -ErrorAction SilentlyContinue).DhcpIPAddress
    $ifaceAddrs = (Get-ItemProperty -LiteralPath $k.PSPath -Name IPAddress -ErrorAction SilentlyContinue).IPAddress
    if (-not $ip -and -not $ifaceAddrs) { continue }
    $cand++
    $v1 = (Get-ItemProperty -LiteralPath $k.PSPath -Name TcpAckFrequency -ErrorAction SilentlyContinue).TcpAckFrequency
    $v2 = (Get-ItemProperty -LiteralPath $k.PSPath -Name TCPNoDelay -ErrorAction SilentlyContinue).TCPNoDelay
    $v3 = (Get-ItemProperty -LiteralPath $k.PSPath -Name TcpDelAckTicks -ErrorAction SilentlyContinue).TcpDelAckTicks
    if ($v1 -eq 1 -and $v2 -eq 1 -and $v3 -eq 1) { $applied++ }
    elseif ($null -eq $v1 -and $null -eq $v2 -and $null -eq $v3) { $default++ }
    else { exit 2 }
}
if ($cand -eq 0) { exit 2 }
if ($applied -eq $cand) { exit 0 }
if ($default -eq $cand) { exit 1 }
exit 2
'''

