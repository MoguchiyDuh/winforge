meta = { id = "performance", title = "Performance", description = "Scheduler quantum 38, RAM-sized svchost split, IFEO CPU/IO priorities, Game DVR off, HAGS on, power throttling off, MPO off, memory compression off (16GB+), best-performance visual effects, Nagle off, separate Explorer processes, BSoD stop codes visible, search indexing off, multimedia throttling and menu delay off; reboot needed for some changes" }

[[tweak]]
id = "win32-priority-separation"
name = "Performance: Win32PrioritySeparation 38 (short quantum)"
group = "Priorities"
preset = "std"

[[tweak.action]]
type = "registry"
path = 'HKLM\SYSTEM\CurrentControlSet\Control\PriorityControl'
name = "Win32PrioritySeparation"
regtype = "dword"
apply = 38
reset = 2

[[tweak]]
id = "svchost-split"
name = "Telemetry: svchost split threshold sized to RAM"
group = "svchost split"
preset = "std"

[[tweak.action]]
type = "command"
apply = '''
$m = (Get-CimInstance Win32_PhysicalMemory | Measure-Object Capacity -Sum).Sum / 1KB
New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control' -Name SvcHostSplitThresholdInKB -PropertyType DWord -Value ([int]$m) -Force | Out-Null
'''
reset = '''
Remove-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control' -Name SvcHostSplitThresholdInKB -ErrorAction SilentlyContinue
exit 0
'''
check = '''
$v = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control' -Name SvcHostSplitThresholdInKB -ErrorAction SilentlyContinue).SvcHostSplitThresholdInKB
if ($null -eq $v) { exit 1 }
$m = (Get-CimInstance Win32_PhysicalMemory | Measure-Object Capacity -Sum).Sum / 1KB
if ([int]$v -eq [int]$m) { exit 0 }
exit 2
'''

