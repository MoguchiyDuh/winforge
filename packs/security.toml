[[tweak]]
id = "firewall-disable"
name = "Firewall: all profiles disabled"
group = "Firewall off"
preset = "max"

[[tweak.action]]
type = "registry"
path = 'HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\DomainProfile'
name = "EnableFirewall"
regtype = "dword"
apply = 0
reset = 1

[[tweak.action]]
type = "registry"
path = 'HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\StandardProfile'
name = "EnableFirewall"
regtype = "dword"
apply = 0
reset = 1

[[tweak.action]]
type = "registry"
path = 'HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\PublicProfile'
name = "EnableFirewall"
regtype = "dword"
apply = 0
reset = 1

[[tweak.action]]
type = "command"
apply = 'Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled False'
reset = 'Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True'
check = '''
try { $profs = @(Get-NetFirewallProfile -ErrorAction Stop) } catch { exit 2 }
if ($profs.Count -ne 3) { exit 2 }
$off = 0
$on = 0
foreach ($p in $profs) {
    if ($p.Enabled -eq $false) { $off++ }
    elseif ($p.Enabled -eq $true) { $on++ }
    else { exit 2 }
}
if ($off -eq 3) { exit 0 }
if ($on -eq 3) { exit 1 }
exit 2
'''

[[tweak]]
id = "vbs-hvci-off"
name = "VBS/HVCI: hypervisor and Memory Integrity off"
group = "VBS / HVCI disable"
preset = "max"

[[tweak.action]]
type = "command"
apply = 'bcdedit /set hypervisorlaunchtype off'
reset = 'bcdedit /set hypervisorlaunchtype auto'
check = '''
$out = & "$env:SystemRoot\System32\bcdedit.exe" /enum '{current}' 2>$null
if ($LASTEXITCODE -ne 0) { exit 2 }
$line = @($out | Where-Object { $_ -match 'hypervisorlaunchtype\s+(\S+)' })[0]
if (-not $line) { exit 1 }
if ($line -match 'hypervisorlaunchtype\s+off\s*$') { exit 0 }
if ($line -match 'hypervisorlaunchtype\s+(auto|on)\s*$') { exit 1 }
exit 2
'''

