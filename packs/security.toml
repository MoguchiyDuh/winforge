[[tweak]]
id = "defender-mppreference"
name = "Defender: Set-MpPreference kill switches"
group = "Defender preferences"
preset = "max"

[[tweak.action]]
type = "command"
apply = '''
Set-MpPreference -DisableRealtimeMonitoring $true
Set-MpPreference -DisableBehaviorMonitoring $true
Set-MpPreference -DisableIOAVProtection $true
Set-MpPreference -DisableScriptScanning $true
Set-MpPreference -DisableArchiveScanning $true
Set-MpPreference -DisableBlockAtFirstSeen $true
Set-MpPreference -DisableRemovableDriveScanning $true
Set-MpPreference -MAPSReporting Disabled
Set-MpPreference -SubmitSamplesConsent NeverSend
Set-MpPreference -PUAProtection Disabled
Set-MpPreference -EnableNetworkProtection Disabled
'''
check = '''
try { $p = Get-MpPreference -ErrorAction Stop } catch { exit 2 }
$names = @('DisableRealtimeMonitoring', 'DisableBehaviorMonitoring', 'DisableIOAVProtection', 'DisableScriptScanning', 'DisableArchiveScanning', 'DisableBlockAtFirstSeen', 'DisableRemovableDriveScanning')
$applied = 0
$default = 0
foreach ($n in $names) {
    $v = $p.$n
    if ($v -eq $true) { $applied++ }
    elseif ($v -eq $false) { $default++ }
    else { exit 2 }
}
if ([int]$p.MAPSReporting -eq 0) { $applied++ }
elseif ($null -eq $p.MAPSReporting -or [int]$p.MAPSReporting -eq 2) { $default++ }
else { exit 2 }
if ([int]$p.SubmitSamplesConsent -eq 2) { $applied++ }
elseif ($null -eq $p.SubmitSamplesConsent -or [int]$p.SubmitSamplesConsent -eq 1) { $default++ }
else { exit 2 }
if ($applied -eq 9) { exit 0 }
if ($default -eq 9) { exit 1 }
exit 2
'''
reset = '''
Set-MpPreference -DisableRealtimeMonitoring $false
Set-MpPreference -DisableBehaviorMonitoring $false
Set-MpPreference -DisableIOAVProtection $false
Set-MpPreference -DisableScriptScanning $false
Set-MpPreference -DisableArchiveScanning $false
Set-MpPreference -DisableBlockAtFirstSeen $false
Set-MpPreference -DisableRemovableDriveScanning $false
Set-MpPreference -MAPSReporting Advanced
Set-MpPreference -SubmitSamplesConsent SendSafeSamples
Set-MpPreference -PUAProtection Disabled
Set-MpPreference -EnableNetworkProtection Disabled
'''

