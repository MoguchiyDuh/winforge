meta = { id = "security", title = "Security", description = "Disables Defender (policy, preferences, services, tamper pin, realtime suspend toggle), firewall, UAC prompts, VBS/HVCI, SmartScreen and SMB1. Turn Tamper Protection OFF manually in Windows Security before applying. SMB1 off breaks old NAS sharing" }

