[[tweak]]
id = "defender-realtime-suspend"
name = "Security: suspend Defender real-time monitoring (red warning)"
group = "Defender preferences"
preset = "max"
desc = "flips DisableRealtimeMonitoring alone for temporary benchmarking or setup work (leaves a red Windows Security warning; exits skip when Tamper Protection blocks it)"

[[tweak.action]]
type = "command"
apply = '''
try {
    Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
} catch {
    Write-Output 'blocked: turn Tamper Protection off in Windows Security first'
    exit 3
}
'''
reset = '''
try {
    Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction Stop
} catch {
    exit 3
}
'''
check = '''
try { $p = Get-MpPreference -ErrorAction Stop } catch { exit 2 }
if ($p.DisableRealtimeMonitoring -eq $true) { exit 0 }
if ($p.DisableRealtimeMonitoring -eq $false) { exit 1 }
exit 2
'''

