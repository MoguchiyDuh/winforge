[[tweak]]
id = "advanced-smb1-off"
name = "Advanced: SMB1 protocol off"
group = "advanced"
preset = "max"

[[tweak.action]]
type = "command"
apply = 'Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart'
reset = 'exit 0'
check = '''
try { $f = Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -ErrorAction Stop } catch { exit 2 }
if ($f.State -eq 'Enabled') { exit 1 }
if ($f.State -eq 'Disabled' -or $f.State -eq 'DisabledWithPayloadRemoved' -or $f.State -eq 'Absent') { exit 0 }
exit 2
'''

[[tweak]]
id = "smartscreen-off"
name = "Security: SmartScreen off"
group = "SmartScreen"
preset = "max"
desc = "sets the EnableSmartScreen policy to 0 so Explorer and Edge no longer run SmartScreen reputation checks (reset deletes the policy value, the stock state)"

[[tweak.action]]
type = "command"
apply = '''
New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Force -ErrorAction SilentlyContinue | Out-Null
New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name EnableSmartScreen -Value 0 -PropertyType DWord -Force | Out-Null
'''
reset = '''
Remove-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name EnableSmartScreen -ErrorAction SilentlyContinue
exit 0
'''
check = '''
$v = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name EnableSmartScreen -ErrorAction SilentlyContinue).EnableSmartScreen
if ($null -eq $v) { exit 1 }
if ([int]$v -eq 0) { exit 0 }
exit 2
'''
