[[tweak.action]]
type = "command"
apply = '''
try { Disable-WindowsErrorReporting -ErrorAction Stop } catch { exit 1 }
'''
reset = '''
try { Enable-WindowsErrorReporting -ErrorAction Stop } catch { exit 1 }
'''
check = '''
try { $w = Get-WindowsErrorReporting -ErrorAction Stop } catch { exit 2 }
if ($w -eq 'Disabled') { exit 0 }
if ($w -eq 'Enabled') { exit 1 }
exit 2
'''

