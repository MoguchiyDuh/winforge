[package]
name = "winforge"
version = "0.1.3"
edition = "2024"
build = "build.rs"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
winreg = "0.56.0"
windows-sys = { version = "0.61.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
