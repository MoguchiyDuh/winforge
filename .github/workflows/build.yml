name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install MinGW linker
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build
        run: cargo build --release --locked
      - name: Checksum
        working-directory: target/x86_64-pc-windows-gnu/release
        run: sha256sum winforge.exe > winforge.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: winforge
          path: |
            target/x86_64-pc-windows-gnu/release/winforge.exe
            target/x86_64-pc-windows-gnu/release/winforge.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: winforge
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" winforge.exe winforge.exe.sha256 --generate-notes
